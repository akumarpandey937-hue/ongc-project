<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solution Repository</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ticket.css">
</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">
        <div class="logo-section">
            <h2>Ongc Support Portal</h2>
            <p>Operations Workspace</p>
        </div>

        <div class="user-box">
            <h4>CURRENT USER</h4>
            <div class="user-info">
                <span id="userName"></span>
            </div>
        </div>

        <nav class="menu">

            <a class="active" href="tickets.html">
                Solution Repository
            </a>

            <a href="dashboard.html">
                Ticket Dashboard
            </a>

            <a href="add-solution.html">
                Add Solution
            </a>

            <a href="#">
                Categories
            </a>


        </nav>

        <button class="logout-btn">
            Secure Logout
        </button>

    </aside>

    <!-- CONTENT -->

    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Knowledge Base</h1>
                <p>Knowledge & Support System</p>
            </div>

            <div class="user-profile-menu">
                <button class="profile-trigger" id="profileTrigger" aria-label="User Profile">
                    <span class="avatar-circle" id="avatarCircle">--</span>
                    <span class="status-indicator online"></span>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="dropdown-header">
                        <div class="dropdown-avatar" id="dropdownAvatar">--</div>
                        <div class="dropdown-user-info">
                            <div class="dropdown-username" id="dropdownUsername">--</div>
                            <div class="dropdown-role" id="dropdownRole">--</div>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-menu-list">
                        <button class="dropdown-item" id="viewDetailsBtn">
                            Account Details
                        </button>
                        <button class="dropdown-item logout-item" id="dropdownLogoutBtn">
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>

        </header>

        <section class="repository-container">

            <div class="table-wrapper">

                <table>

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>Software Category</th>

                        <th>Issue Title</th>

                        <th>Preview</th>

                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody id="solutionTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="js/tickets.js"></script>

</body>
</html>
