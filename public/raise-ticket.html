<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise Issue</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/add-solution.css">
</head>
<body>

<div class="app-container">

    <aside class="sidebar">
        <div class="logo-section">
            <img src="assets/icons/logo.webp" alt="logo">
            <div class="logo-title">Ongc Support Portal</div>
            <div class="logo-subtitle">Operations Workspace</div>
        </div>

        <div class="sidebar-menu">
            <ul>
                <li><a href="index.html">Knowledge Hub</a></li>
                <li><a href="dashboard.html">Issue Dashboard</a></li>
            </ul>
        </div>

        <div class="logout-area">
            <button class="logout-btn" type="button">Secure Logout</button>
        </div>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="page-title">Raise Issue</div>
                <div class="page-subtitle">Submit a new support request</div>
            </div>
            <div class="user-profile-menu">
                <button class="profile-trigger" id="profileTrigger" aria-label="User Profile">
                    <span class="avatar-circle" id="avatarCircle">--</span>
                    <span class="status-indicator online"></span>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="dropdown-header">
                        <div class="dropdown-avatar" id="dropdownAvatar">--</div>
                        <div class="dropdown-user-info">
                            <div class="dropdown-username" id="dropdownUsername">--</div>
                            <div class="dropdown-role" id="dropdownRole">--</div>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-menu-list">
                        <button class="dropdown-item" id="viewDetailsBtn">
                            Account Details
                        </button>
                        <button class="dropdown-item logout-item" id="dropdownLogoutBtn">
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="ticket-container">

                <h2>Submit a New Request</h2>

                <div class="form-group">
                    <label for="ticketSubject">Issue Subject</label>
                    <input type="text" id="ticketSubject" placeholder="e.g. VPN connection failure">
                </div>

                <div class="form-group">
                    <label for="ticketCategory">Software Category</label>
                    <select id="ticketCategory">
                        <option value="">Select Software Category</option>
                        <option>PARADIGM</option>
                        <option>OMEGA</option>
                        <option>CGG</option>
                        <option>GEOTOMO</option>
                        <option>SCUBE</option>
                        <option>SHARP REFLECTION</option>
                        <option>LINUX</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <div id="editor"></div>
                </div>

                <div class="form-group">
                    <label for="fileUpload">Attach Screenshot or Log File</label>
                    <input type="file" id="fileUpload">
                    <small>Allowed formats: JPG, PNG, PDF, DOCX, TXT</small>
                </div>

                <div class="btns">
                    <button type="button" class="cancel-btn">Cancel</button>
                    <button type="button" class="submit-btn" onclick="submitTicket()">Submit Issue</button>
                </div>
            </div>
        </div>

        <div class="footer">Developed by Vansh Gupta</div>
    </div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="js/api.js?v=1.2"></script>
<script src="js/main.js?v=1.2"></script>
<script src="js/solution.js?v=1.2"></script>

</body>
</html>
