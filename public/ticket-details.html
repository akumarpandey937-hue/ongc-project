<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Details — ONGC Support Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .detail-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            max-width: 900px;
            margin-bottom: 24px;
        }

        .detail-header-block {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .ticket-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .detail-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-val {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .description-box {
            line-height: 1.7;
            color: var(--text-primary);
            padding: 16px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-height: 100px;
        }

        /* Reply Conversation Thread */
        .thread-section {
            max-width: 900px;
            margin-bottom: 24px;
        }

        .thread-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reply-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-left: 4px solid #16a34a; /* Green accent for resolved */
            border-radius: 12px;
            padding: 24px;
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .reply-card.unresolved {
            border-left-color: #d97706; /* Orange accent for unresolved */
        }

        .reply-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
            box-shadow: 0 2px 4px rgba(22, 163, 74, 0.2);
        }

        .reply-card.unresolved .reply-avatar {
            background: linear-gradient(135deg, #d97706, #b45309);
            box-shadow: 0 2px 4px rgba(217, 119, 6, 0.2);
        }

        .reply-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .reply-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .reply-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reply-author {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-primary);
        }

        .reply-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            background: #f0fdf4;
            color: #16a34a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #dcfce7;
        }

        .reply-card.unresolved .reply-badge {
            background: #fffbeb;
            color: #d97706;
            border-color: #fef3c7;
        }

        .reply-body {
            font-size: 15px;
            line-height: 1.6;
            color: #334155; /* Slate-700 for high readability */
            white-space: pre-wrap;
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #f1f5f9;
        }

        .reply-footer {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .no-reply-alert {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.15);
            border-radius: 8px;
            padding: 16px;
            color: var(--accent-gold);
            font-size: 14px;
            font-weight: 500;
        }

        /* Admin Reply Form */
        .reply-form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            max-width: 900px;
        }

        .form-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 16px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--active-text);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-gold);
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-section">
                <img src="assets/icons/logo.webp" alt="logo">
                <div class="logo-title">Ongc Support Portal</div>
                <div class="logo-subtitle">Operations Workspace</div>
            </div>



            <div class="sidebar-menu">
                <ul>
                    <!-- Dynamic Menu loaded from main.js -->
                </ul>
            </div>

            <div class="logout-area">
                <button class="logout-btn" id="logoutBtn">Secure Logout</button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="topbar">
                <div>
                    <div class="page-title">Issue Details</div>
                    <div class="page-subtitle">View and update support issue status</div>
                </div>

                <div class="user-profile-menu">
                    <button class="profile-trigger" id="profileTrigger" aria-label="User Profile">
                        <span class="avatar-circle" id="avatarCircle">--</span>
                        <span class="status-indicator online"></span>
                    </button>
                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="dropdown-header">
                            <div class="dropdown-avatar" id="dropdownAvatar">--</div>
                            <div class="dropdown-user-info">
                                <div class="dropdown-username" id="dropdownUsername">--</div>
                                <div class="dropdown-role" id="dropdownRole">--</div>
                            </div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-menu-list">
                            <button class="dropdown-item" id="viewDetailsBtn">
                                Account Details
                            </button>
                            <button class="dropdown-item logout-item" id="dropdownLogoutBtn">
                                Sign Out
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="content-wrapper">
                <a href="dashboard.html" class="back-link" id="backLink">← Back to Dashboard</a>

                <!-- TICKET INFO CARD -->
                <div class="detail-card">
                    <div class="detail-header-block">
                        <div class="ticket-title" id="ticketSubject">Loading...</div>
                        <div id="ticketStatusBadge"><span class="badge">--</span></div>
                    </div>

                    <div class="detail-meta-grid">
                        <div class="meta-item">
                            <span class="meta-label">Issue ID</span>
                            <span class="meta-val" id="ticketId">#--</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Category</span>
                            <span class="meta-val" id="ticketCategory">--</span>
                        </div>

                    </div>

                    <div class="meta-label" style="margin-bottom: 8px;">Issue Description</div>
                    <div class="description-box" id="ticketDescription">
                        <!-- quill html description goes here -->
                    </div>

                    <!-- ATTACHMENT SECTION -->
                    <div id="attachmentSection" style="margin-top: 24px; display: none;">
                        <div class="meta-label" style="margin-bottom: 8px;">Attachment</div>
                        <div class="description-box" style="display: flex; flex-direction: column; gap: 12px; min-height: auto; padding: 16px; background: #f8fafc;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" style="color: var(--active-text); flex-shrink: 0;">
                                  <path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0V3z"/>
                                </svg>
                                <a id="attachmentLink" href="#" target="_blank" style="font-weight: 600; color: var(--active-text); text-decoration: none; word-break: break-all; transition: color 0.2s;">Filename.ext</a>
                            </div>
                            <div id="attachmentPreviewContainer" style="display: none; border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 4px;">
                                <!-- Image preview will be rendered here -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RESPONSES THREAD -->
                <div class="thread-section">
                    <div class="thread-title">
                        <span>Responses & Comments</span>
                    </div>
                    <div id="threadContainer">
                        <p>Loading...</p>
                    </div>
                </div>

                <!-- ADMIN RESPONSE PANEL (Hidden by default, shown for admin role) -->
                <div class="reply-form-card" id="adminReplyForm" style="display: none;">
                    <div class="form-title">Send Response</div>

                    <div class="form-group" style="margin-bottom: 16px;">
                        <label for="adminReplyText">Your Message</label>
                        <textarea id="adminReplyText" rows="6" placeholder="Type your response to the user here..."
                            style="resize: vertical;"></textarea>
                    </div>

                    <div class="row" style="display: flex; gap: 16px; margin-bottom: 16px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="adminStatusSelect">Update Status</label>
                            <select id="adminStatusSelect">
                                <option value="Resolved" selected>Resolved</option>
                                <option value="Unresolved">Unresolved</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelReplyBtn">Cancel</button>
                        <button type="button" class="btn btn-primary" id="submitReplyBtn">Submit Reply</button>
                    </div>
                </div>
            </div>

            <div class="footer">
                Developed by Vansh Gupta
            </div>
        </div>
    </div>

    <script src="js/api.js?v=1.2"></script>
    <script src="js/main.js?v=1.2"></script>
    <script src="js/ticket-details.js?v=1.2"></script>

</body>

</html>
