<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Knowledge Hub</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ticket.css">

</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo-section">

            <img src="assets/icons/logo.webp" alt="logo">

            <div class="logo-title">
               Ongc Support Portal
            </div>

            <div class="logo-subtitle">
                Operations Workspace
            </div>

        </div>



        <!-- MENU -->

        <div class="sidebar-menu">

            <ul>

                <li>
                    <a href="index.html" class="active">
                        Knowledge Hub
                    </a>
                </li>

                <li>
                    <a href="dashboard.html">
                        Issue Dashboard
                    </a>
                </li>


                <li>
                    <a href="#">
                        Categories
                    </a>
                </li>


            </ul>

        </div>

        <div class="logout-area">

            <button class="logout-btn" id="logoutBtn">
                Secure Logout
            </button>

        </div>

    </aside>

    <!-- MAIN -->

    <div class="main-content">

        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <div class="page-title">
                    Knowledge Hub
                </div>

                <div class="page-subtitle">
                    Centralized Knowledge Hub & Support System
                </div>

            </div>

            <div class="user-profile-menu">
                <button class="profile-trigger" id="profileTrigger" aria-label="User Profile">
                    <span class="avatar-circle" id="avatarCircle">--</span>
                    <span class="status-indicator online"></span>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="dropdown-header">
                        <div class="dropdown-avatar" id="dropdownAvatar">--</div>
                        <div class="dropdown-user-info">
                            <div class="dropdown-username" id="dropdownUsername">--</div>
                            <div class="dropdown-role" id="dropdownRole">--</div>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-menu-list">
                        <button class="dropdown-item" id="viewDetailsBtn">
                            Account Details
                        </button>
                        <button class="dropdown-item logout-item" id="dropdownLogoutBtn">
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- CONTENT -->

        <div class="content-wrapper">

            <!-- KNOWLEDGE HUB TOOLBAR -->
            <div class="knowledge-hub-toolbar">
                <div class="category-tabs" id="categoryTabs">
                    <button class="category-tab active" data-category="All">All Systems</button>
                    <button class="category-tab" data-category="GEOTOMO">GEOTOMO</button>
                    <button class="category-tab" data-category="OMEGA">OMEGA</button>
                    <button class="category-tab" data-category="PARADIGM">PARADIGM</button>
                    <button class="category-tab" data-category="CGG">CGG</button>
                    <button class="category-tab" data-category="LINUX">LINUX</button>
                    <button class="category-tab" data-category="SCUBE">SCUBE</button>
                    <button class="category-tab" data-category="SHARP REFLECTION">SHARP REFLECTION</button>
                </div>
                <div class="toolbar-right">
                    <input
                        type="text"
                        id="solutionSearch"
                        placeholder="Search articles..."
                        class="search-input-small"
                    >
                    <a href="add-solution.html" class="btn-add-solution" id="addSolutionBtn" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="vertical-align: middle;">
                          <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                        </svg>
                        Publish Solution
                    </a>
                </div>
            </div>

            <!-- TABLE -->

            <div class="card">

                <table>

                    <thead>

                        <tr>

                            <th class="id-header">ID</th>

                            <th class="category-header">Software Category</th>

                            <th class="title-header">Issue Title</th>

                            <th class="preview-header">Preview</th>

                            <th class="action-header">Action</th>

                        </tr>

                    </thead>

                    <tbody id="solutionTableBody">

                    </tbody>

                </table>

            </div>

        </div>

        <!-- FOOTER -->

        <div class="footer">

            Developed by Vansh Gupta

        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/solutions.js"></script>
<script src="js/main.js"></script>

</body>
</html>
