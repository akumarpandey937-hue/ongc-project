<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Support Helpdesk</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo-section">

            <img src="assets/icons/logo.webp" alt="logo">

            <div class="logo-title">
                Ongc Support Portal
            </div>

            <div class="logo-subtitle">
                Operations Workspace
            </div>

        </div>



        <div class="sidebar-menu">

            <ul>

                <li>
                    <a href="index.html">
                        Knowledge Hub
                    </a>
                </li>

                <li>
                    <a href="dashboard.html" class="active">
                        Issue Dashboard
                    </a>
                </li>


                <li>
                    <a href="#">
                        Categories
                    </a>
                </li>


            </ul>

        </div>

        <div class="logout-area">

            <button class="logout-btn">
                Secure Logout
            </button>

        </div>

    </aside>

    <!-- MAIN CONTENT -->

    <div class="main-content">

        <div class="topbar">

            <div>

                <div class="page-title">
                    IT Support Helpdesk
                </div>


            </div>

            <div class="user-profile-menu">
                <button class="profile-trigger" id="profileTrigger" aria-label="User Profile">
                    <span class="avatar-circle" id="avatarCircle">--</span>
                    <span class="status-indicator online"></span>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="dropdown-header">
                        <div class="dropdown-avatar" id="dropdownAvatar">--</div>
                        <div class="dropdown-user-info">
                            <div class="dropdown-username" id="dropdownUsername">--</div>
                            <div class="dropdown-role" id="dropdownRole">--</div>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-menu-list">
                        <button class="dropdown-item" id="viewDetailsBtn">
                            Account Details
                        </button>
                        <button class="dropdown-item logout-item" id="dropdownLogoutBtn">
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <div class="content-wrapper">


            <!-- STATS -->

            <div class="stats-grid">

                <div class="stat-card">

                    <h4>Total Issues</h4>

                    <h1 id="totalTickets">
                        -
                    </h1>

                </div>

                <div class="stat-card">

                    <h4>Resolved</h4>

                    <h1 id="resolvedTickets">
                        -
                    </h1>

                </div>

                <div class="stat-card">

                    <h4>Unresolved</h4>

                    <h1 id="unresolvedTickets">
                        -
                    </h1>

                </div>

            </div>

            <!-- FILTERS -->

            <div class="card dashboard-filters">

                <select id="statusFilter">
                    <option value="">
                        All Statuses
                    </option>
                </select>

                <select id="categoryFilter">
                    <option value="">
                        All Software Categories
                    </option>
                </select>

                <a href="raise-ticket.html" class="btn btn-primary" style="display:inline-block;text-decoration:none;text-align:center;padding:12px 20px;">
                    + Raise New Issue
                </a>

            </div>

            <!-- TABLE -->

            <div class="card">

                <div class="table-header">

                    <input
                        type="text"
                        placeholder="Search issues..."
                        id="ticketSearch"
                    >

                </div>

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Software</th>
                            <th>Subject</th>
                            <th>Raised By</th>
                            <th>Date Raised</th>
                            <th>Date Resolved</th>
                            <th>Resolved By</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="ticketTableBody">

                    </tbody>

                </table>

            </div>

        </div>

        <div class="footer">

            Developed by Vansh Gupta

        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/main.js"></script>

</body>
</html>
